# Render Blueprint - Wine Shop API
# Deploy with: https://render.com/deploy

services:
  # Go Backend API
  - type: web
    name: wine-shop-api
    runtime: docker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wine-shop-db
          property: connectionString
      - key: API_SECRET
        generateValue: true
      - key: TOKEN_HOUR_LIFESPAN
        value: 24
      - key: GIN_MODE
        value: release

databases:
  # PostgreSQL Database
  - name: wine-shop-db
    plan: free
    databaseName: wine_shop
    user: wine_shop_user
